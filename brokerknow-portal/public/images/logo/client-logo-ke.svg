<svg xmlns="http://www.w3.org/2000/svg" width="360" height="96" viewBox="0 0 360 96" role="img" aria-label="Axis Kenya">
  <title>Axis Kenya</title>
  <!-- Emblem: Kenya-flag-inspired shield -->
  <g transform="translate(8,12)">
    <rect x="0" y="0" width="72" height="72" rx="14" fill="#0f1b2d"/>
    <g transform="translate(12,14)">
      <rect x="0" y="0"  width="48" height="12" rx="2" fill="#111111"/>
      <rect x="0" y="16" width="48" height="12" rx="2" fill="#b71c1c"/>
      <rect x="0" y="32" width="48" height="12" rx="2" fill="#1b7a3d"/>
      <!-- spear/shield motif -->
      <path d="M24 -3 L31 22 L24 47 L17 22 Z" fill="#f5f5f5" opacity="0.92"/>
      <circle cx="24" cy="22" r="6" fill="#b71c1c" stroke="#f5f5f5" stroke-width="2"/>
    </g>
  </g>
  <!-- Wordmark -->
  <g transform="translate(96,0)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="0" y="46" font-size="30" font-weight="700" fill="#0f1b2d" letter-spacing="0.5">AXIS <tspan fill="#1b7a3d">KENYA</tspan></text>
    <text x="2" y="68" font-size="13" font-weight="500" fill="#5b6b7b" letter-spacing="1.5">NAIROBI SECURITIES EXCHANGE</text>
  </g>
</svg>
