# BrokerKnow Nginx — hostname-based vhosts for cedarcapital.mw
#
# Layout (after DNS flip):
#   portal.cedarcapital.mw       -> /var/www/portal       + /api/ -> :5260   (PROD)
#   admin.cedarcapital.mw        -> /var/www/admin-host   + /api/ -> :5260   (PROD)
#   test-portal.cedarcapital.mw  -> /var/www/test-portal  + /api/ -> :5261   (TEST)
#   test-admin.cedarcapital.mw   -> /var/www/test-admin   + /api/ -> :5261   (TEST)
#
# Fallback (default_server on the bare IP) preserves the legacy path-based
# layout so the droplet keeps working during DNS migration:
#   / -> portal SPA, /admin/ -> /var/www/admin (legacy /admin/-base build),
#   /api/ -> :5260.
#
# TLS is added by certbot --nginx; do not hand-edit the listen 443 lines
# after that.

# ---- Reusable snippets (proxy params) ----
# /api/ -> backend; used by every app vhost
# (inlined below because we need different upstream ports)

# =============== FALLBACK (bare IP) ===============
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 50M;

    location /mail/ {
        auth_basic "MailHog";
        auth_basic_user_file /etc/nginx/.mailhog_htpasswd;
        proxy_pass http://127.0.0.1:8025/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:5260;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
        proxy_read_timeout 300s;
    }

    location /admin/ {
        alias /var/www/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        root /var/www/portal;
        try_files $uri $uri/ /index.html;
    }
}

