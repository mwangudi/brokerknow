
# =============== TEST: rwandatest.martensafrica.com (Rwanda test) ===============
# Rwanda TEST environment. Portal at /, back-office at /admin, API -> :5262.
# TLS added by certbot --nginx.
server {
    listen 80;
    server_name rwandatest.martensafrica.com;
    client_max_body_size 50M;

    location /api/ {
        proxy_pass         http://127.0.0.1:5262;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
        proxy_read_timeout 300s;
    }

    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /var/www/rwandatest-admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        root /var/www/rwandatest-portal;
        try_files $uri $uri/ /index.html;
    }
}
