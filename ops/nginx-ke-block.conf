# =============== KE TEST: ke.martensafrica.com (host-rooted KE admin) ===============
# Green Margin Capital / KES / NSE back-office. Admin SPA at /, API -> :5264
# (BrokerKnow_KE_Clean). TLS added by `certbot --nginx`. Mirrors the cedarcapital
# host-rooted model. The default server still serves /ke/ for direct-IP access.
server {
    server_name ke.martensafrica.com;
    client_max_body_size 50M;

    location /api/ {
        proxy_pass         http://127.0.0.1:5264;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
        proxy_read_timeout 300s;
    }

    location / {
        root /var/www/ke-admin-host;
        try_files $uri $uri/ /index.html;
    }

    listen 80;
}
